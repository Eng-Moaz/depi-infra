---
- name: Install kubeadm on all nodes
  hosts: k8s
  become: true
  vars:
    kubernetes_version: "1.35"
  tasks:
    - name: Wait for SSH through the bastion
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Set the hostname to the inventory name (becomes the node name)
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Keep cloud-init from resetting the hostname
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
        content: "preserve_hostname: true\n"
        mode: "0644"

    - name: Make the hostname resolve locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: Turn swap off
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Load kernel modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load kernel modules now
      ansible.builtin.command: modprobe {{ item }}
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: "0644"
      register: sysctl

    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      when: sysctl.changed

    - name: Install containerd and prerequisites
      ansible.builtin.dnf:
        name: [containerd, iptables-nft, iproute-tc, conntrack-tools, socat]
        state: present

    - name: Add the Kubernetes repo
      ansible.builtin.yum_repository:
        name: kubernetes
        description: Kubernetes
        baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/"
        gpgcheck: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/rpm/repodata/repomd.xml.key"
        exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Install kubelet, kubeadm, kubectl
      ansible.builtin.dnf:
        name: [kubelet, kubeadm, kubectl]
        state: present
        disable_excludes: kubernetes

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: containerd_default
      changed_when: false
      check_mode: false

    - name: Use the systemd cgroup driver
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: "{{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
        mode: "0644"
      register: containerd_conf

    - name: Enable and (re)start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: "{{ 'restarted' if containerd_conf.changed else 'started' }}"

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

- name: Initialise the control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Already initialised?
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: kubeadm init
      ansible.builtin.command: >-
        kubeadm init --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_host }}
      when: not admin_conf.stat.exists

    - name: Copy kubeconfig for {{ ansible_user }}
      ansible.builtin.shell: |
        mkdir -p /home/{{ ansible_user }}/.kube
        cp -f /etc/kubernetes/admin.conf /home/{{ ansible_user }}/.kube/config
        chown -R {{ ansible_user }}: /home/{{ ansible_user }}/.kube
      changed_when: false

    - name: Install flannel network plugin
      ansible.builtin.command: >-
        kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Create the worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

- name: Join the workers
  hosts: workers
  become: true
  tasks:
    - name: Already joined?
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: kubeadm join
      ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]].join_command.stdout }}"
      when: not kubelet_conf.stat.exists

- name: Verify the cluster
  hosts: control_plane
  become: true
  tasks:
    - name: Wait until all nodes are Ready
      ansible.builtin.command: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes
      until: >-
        nodes.stdout_lines | length == groups['k8s'] | length and
        (nodes.stdout_lines | select('search', ' Ready ') | list | length) == groups['k8s'] | length
      retries: 40
      delay: 15
      changed_when: false

    - name: Label the workers
      ansible.builtin.command: kubectl label node {{ item }} node-role.kubernetes.io/worker= --overwrite
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      loop: "{{ groups['workers'] }}"
      changed_when: false

    - name: kubectl get nodes
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nodes_wide
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: nodes_wide.stdout_lines

- name: Install Argo CD
  hosts: control_plane
  become: true
  vars:
    argocd_version: v3.6.2
    helm_repo: git@github.com:Eng-Moaz/depi-helm.git
    apps_repo: git@github.com:Eng-Moaz/depi-argocd.git
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Create the argocd namespace
      ansible.builtin.shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Install Argo CD
      ansible.builtin.command: >-
        kubectl apply -n argocd --server-side --force-conflicts
        -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
      changed_when: false

    - name: Expose the Argo CD UI on NodePort 30443
      ansible.builtin.command: >-
        kubectl patch svc argocd-server -n argocd
        -p '{"spec":{"type":"NodePort","ports":[{"name":"https","port":443,"nodePort":30443}]}}'
      changed_when: false

    - name: Wait for Argo CD to be ready
      ansible.builtin.command: kubectl rollout status {{ item }} -n argocd --timeout=300s
      loop:
        - deployment/argocd-server
        - deployment/argocd-repo-server
        - deployment/argocd-redis
        - deployment/argocd-applicationset-controller
        - statefulset/argocd-application-controller
      changed_when: false

    # Read-only deploy keys, passed in from GitHub secrets. Skipped when not provided.
    - name: Give Argo CD read access to the private repos
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ manifest | to_nice_yaml }}"
      vars:
        manifest:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: git
            url: "{{ item.url }}"
            sshPrivateKey: "{{ lookup('env', item.env) }}"
      loop:
        - { name: repo-depi-helm, url: "{{ helm_repo }}", env: ARGOCD_HELM_KEY }
        - { name: repo-depi-argocd, url: "{{ apps_repo }}", env: ARGOCD_APPS_KEY }
      when: lookup('env', item.env) | length > 0
      no_log: true
      changed_when: false

    # The root Application watches apps/ in depi-argocd; every file there becomes an Application.
    - name: Create the root Application
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ root_app | to_nice_yaml }}"
      vars:
        root_app:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: root
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: "{{ apps_repo }}"
              targetRevision: main
              path: apps
            destination:
              server: https://kubernetes.default.svc
              namespace: argocd
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
      changed_when: false

    - name: Argo CD pods and applications
      ansible.builtin.shell: kubectl get pods -n argocd; echo; kubectl get applications -n argocd
      register: argo
      changed_when: false

    - name: Show Argo CD status
      ansible.builtin.debug:
        var: argo.stdout_lines
